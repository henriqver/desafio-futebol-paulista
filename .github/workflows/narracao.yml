name: Gerar narração

# Sempre que os CSV mudarem, gera os áudios das falas novas e publica junto com o site.
on:
  push:
    branches: [main]
    paths: ["dados/**", "ferramentas/gerar_narracao.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar áudios
        env:
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
        run: python ferramentas/gerar_narracao.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narracao
          git diff --cached --quiet || (git commit -m "Narração atualizada" && git push)
